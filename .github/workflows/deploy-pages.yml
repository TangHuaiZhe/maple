name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_BASE: /${{ github.event.repository.name }}
      VITE_ASSET_BASE_URL: https://maple-684e2.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check data
        run: npm run check:data

      - name: Run tests
        run: npm test

      - name: Build Pages site
        run: npm run build

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/data/catalog.json
          test -f dist/data/image-thumbs.json
          test -d dist/thumbs

          if find dist -maxdepth 1 -type d \( \
            -name "rhs-images" \
            -o -name "mrmaple-images" \
            -o -name "herter-images" \
            -o -name "ncsu-images" \
            -o -name "coniferkingdom-images" \
            -o -name "jmac-images" \
            -o -name "user-images" \
          \) -print -quit | grep -q .; then
            echo "Raw image directories must remain on Firebase, not in GitHub Pages."
            exit 1
          fi

          size_kb=$(du -sk dist | cut -f1)
          if [ "$size_kb" -ge 950000 ]; then
            echo "Pages artifact is too large: ${size_kb} KB"
            exit 1
          fi

          du -sh dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
